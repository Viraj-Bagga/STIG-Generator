name: Screenshots

# Renders the app on a virtual display and pushes the PNGs to the
# ci/screenshots branch, so README images always come from the real UI.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - ci/screenshots
    paths:
      - "gui.py"
      - "engine.py"
      - "examples/**"
      - "scripts/screenshots.py"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tk, a virtual display and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk xvfb imagemagick fonts-dejavu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Capture
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python scripts/screenshots.py shots

      - name: Push to ci/screenshots
        run: |
          cd shots
          git init -q -b ci/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci/screenshots
