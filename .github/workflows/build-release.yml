name: Build & Release

# Pull requests and manual runs build both binaries as workflow artifacts.
# Pushing a v* tag also publishes them to a GitHub release.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            ext: ""
          - os: windows-latest
            platform: windows-x86_64
            ext: ".exe"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies (Tkinter + display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk libxcb-xinerama0 libxcb1 \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone binary
        run: pyinstaller stig_authoring_pro.spec --distpath dist/ --workpath build/

      - name: Name binary with version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          mv "dist/STIG-Authoring-Pro${{ matrix.ext }}" "dist/STIG-Authoring-Pro-${VERSION}-${{ matrix.platform }}${{ matrix.ext }}"
          ls -l dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: STIG-Authoring-Pro-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          name: "STIG Authoring Pro ${{ github.ref_name }}"
          body: |
            ## STIG Authoring Pro ${{ github.ref_name }}

            Download the binary for your platform and run it. No Python installation needed.

            ### Linux (Debian/Ubuntu x86_64)
            ```bash
            chmod +x STIG-Authoring-Pro-${{ github.ref_name }}-linux-x86_64
            ./STIG-Authoring-Pro-${{ github.ref_name }}-linux-x86_64
            ```
            Needs a desktop session (X11, or Wayland with XWayland) and `libxcb`/`libx11`, which most Debian and Ubuntu installs already have.

            ### Windows (x86_64)
            Run `STIG-Authoring-Pro-${{ github.ref_name }}-windows-x86_64.exe`. The binary is unsigned, so SmartScreen may ask you to confirm the first time.
          files: dist/*
          draft: false
          prerelease: false
